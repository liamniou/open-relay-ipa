name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - name: Check out pipeline and pinned upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Identify stable upstream version
        id: upstream
        run: |
          git -C upstream fetch --tags
          version="$(git -C upstream tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::The upstream submodule must point to a stable version tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Apply build patches to upstream
        run: |
          : > "$RUNNER_TEMP/applied.patch"
          shopt -s nullglob
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            name="$(basename "$patch")"
            if git -C upstream apply --check "$patch" 2>/dev/null; then
              git -C upstream apply "$patch"
              cat "$patch" >> "$RUNNER_TEMP/applied.patch"
              echo "Applied $name"
            elif git -C upstream apply --reverse --check "$patch" 2>/dev/null; then
              echo "::notice::$name is already included upstream; skipping it. Consider deleting it."
            else
              echo "::error::$name no longer applies to this upstream version. Update or delete it."
              exit 1
            fi
          done

      - name: Select latest installed stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Test sideloaded App Group resolution
        run: |
          swiftc "upstream/Open UI/Shared/AppGroup.swift" tests/AppGroupTests.swift \
            -o "$RUNNER_TEMP/app-group-tests"
          "$RUNNER_TEMP/app-group-tests"

      - name: Build for iPhone and iPad without signing
        run: |
          xcodebuild -version
          xcodebuild build \
            -project "upstream/Open UI.xcodeproj" \
            -scheme "Open UI" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA and corresponding source
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Open UI.app"
          test -d "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -x "$app/$executable"
          lipo "$app/$executable" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/package/Payload" dist
          cp -R "$app" "$RUNNER_TEMP/package/Payload/"
          # AltStore's signer (ldid) crashes on arm64_32 watchOS binaries, and
          # AltStore does not provision or re-identify embedded Watch apps.
          rm -rf "$RUNNER_TEMP/package/Payload/Open UI.app/Watch"
          while IFS= read -r -d '' file; do
            archs="$(lipo -archs "$file" 2>/dev/null)" || continue
            for arch in $archs; do
              if [[ "$arch" != arm64 && "$arch" != arm64e ]]; then
                echo "::error::${file#"$RUNNER_TEMP/package/"} contains '$arch'; AltStore can only sign arm64/arm64e binaries."
                exit 1
              fi
            done
          done < <(find "$RUNNER_TEMP/package/Payload" -type f -print0)
          # Unsigned Mach-O files have no entitlements for AltStore to discover.
          # Ad-hoc signatures carry only the App Group request, not paid capabilities.
          packaged_app="$RUNNER_TEMP/package/Payload/Open UI.app"
          shopt -s nullglob
          for framework in "$packaged_app"/Frameworks/*.framework; do
            codesign --force --sign - "$framework"
          done
          test -d "$packaged_app/PlugIns/OpenUIShareExtension.appex"
          test -d "$packaged_app/PlugIns/OpenUIWidgetsExtension.appex"
          for bundle in "$packaged_app"/PlugIns/*.appex "$packaged_app"; do
            codesign --force --sign - --generate-entitlement-der \
              --entitlements upstream/OpenUIShareExtension/ShareExtension.entitlements "$bundle"
            codesign --display --entitlements :- "$bundle" > "$RUNNER_TEMP/entitlements.plist"
            group="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/entitlements.plist")"
            if [[ "$group" != group.com.openui.openui ]]; then
              echo "::error::${bundle##*/} is missing the App Group entitlement required by AltStore."
              exit 1
            fi
            codesign --verify "$bundle"
          done
          output="$GITHUB_WORKSPACE/dist/Open-Relay-${UPSTREAM_VERSION}-unsigned.ipa"
          (cd "$RUNNER_TEMP/package" && zip -qry "$output" Payload)
          unzip -tq "$output"
          git -C upstream archive --format=tar.gz --prefix=Open-Relay/ HEAD \
            > "dist/Open-Relay-${UPSTREAM_VERSION}-source.tar.gz"
          cp upstream/LICENSE dist/LICENSE.txt
          if [[ -s "$RUNNER_TEMP/applied.patch" ]]; then
            cp "$RUNNER_TEMP/applied.patch" "dist/Open-Relay-${UPSTREAM_VERSION}-build.patch"
          fi
          {
            echo "Upstream: https://github.com/Ichigo3766/Open-Relay"
            echo "Upstream version: $UPSTREAM_VERSION"
            echo "Upstream commit: $(git -C upstream rev-parse HEAD)"
            echo "Pipeline commit: $GITHUB_SHA"
            echo "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            xcodebuild -version
          } > dist/build-info.txt
          (cd dist && shasum -a 256 ./* > SHA256SUMS)

      - name: Upload IPA, source, and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Open-Relay-${{ steps.upstream.outputs.version }}-unsigned
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish unsigned IPA
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          UPSTREAM_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh run download "$RUN_ID" \
            --name "Open-Relay-${UPSTREAM_VERSION}-unsigned" --dir dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_VERSION: ${{ needs.build.outputs.version }}
          PIPELINE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag="${UPSTREAM_VERSION}-build.${RUN_NUMBER}.${RUN_ATTEMPT}"
          cat > notes.txt <<EOF
          Unsigned iPhone/iPad build of [Open Relay ${UPSTREAM_VERSION}](https://github.com/Ichigo3766/Open-Relay/tree/${UPSTREAM_VERSION}).

          Download the \`.ipa\` asset and open it in **AltStore Classic** to sign and install it. No Apple signing credentials are used by this pipeline.

          Requires **iOS/iPadOS 18.1 or later** for this upstream version. A free Apple ID normally requires refreshing the app every seven days; app extensions consume additional App IDs.

          Corresponding upstream source, any build patch applied on top of it, license, checksums, and build provenance are attached. Pipeline/build instructions: https://github.com/${GH_REPO}/tree/${PIPELINE_SHA}
          EOF
          gh release create "$tag" dist/* \
            --target "$PIPELINE_SHA" \
            --title "Open Relay ${UPSTREAM_VERSION} (unsigned, build ${RUN_NUMBER}.${RUN_ATTEMPT})" \
            --notes-file notes.txt \
            --latest
